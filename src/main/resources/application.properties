# =============================================================
#  CineBase — application.properties
#  Курсовой проект БГУИР 2026
# =============================================================
#
# ШАГ 1: Вставь свой TMDb API Read Access Token (строка 34)
# ШАГ 2: Запусти: mvn clean package -DskipTests
# ШАГ 3: Запусти: java -jar target/film-catalog-1.0.0.jar
# ШАГ 4: Открой:  http://localhost:8080
#
# Где взять TMDb токен:
#   1. Зарегистрируйся на https://www.themoviedb.org/signup
#   2. Перейди на https://www.themoviedb.org/settings/api
#   3. Нажми "Create" → Developer
#   4. Заполни форму (можно написать что угодно)
#   5. Скопируй "API Read Access Token" (длинный, начинается с eyJ...)
#      ВАЖНО: нужен именно "Read Access Token", а НЕ короткий "API Key"
# =============================================================

spring.application.name=film-catalog
server.port=8080

# =============================================================
# База данных SQLite
# film_catalog.db будет создан автоматически рядом с JAR файлом
# =============================================================
spring.datasource.url=jdbc:sqlite:film_catalog.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# =============================================================
# JPA / Hibernate
# =============================================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =============================================================
# TMDb API — ВСТАВЬ СВОЙ ТОКЕН СЮДА ↓
# =============================================================
tmdb.api.token=PASTE_YOUR_TMDB_READ_ACCESS_TOKEN_HERE
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base-url=https://image.tmdb.org/t/p/w500
# Язык ответов от TMDb (ru-RU = русский)
tmdb.api.language=ru-RU

# =============================================================
# JWT — Авторизация
#
# app.jwt.secret — секрет для подписи токенов.
# ВАЖНО: должен быть валидный Base64 (без символов _ и -)
# Готовый секрет уже вставлен ниже — не меняй если не знаешь зачем.
# Если хочешь свой: в командной строке выполни:
#   Windows PowerShell:
#     [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("твой_секрет_минимум_32_символа"))
#   Linux/Mac:
#     echo -n "твой_секрет_минимум_32_символа" | base64
# =============================================================
app.jwt.secret=Q2luZUJhc2VTZWNyZXRLZXkyMDI2QnN1aXJDb3Vyc2VQcm9qZWN0Snd0U2lnbktleQ==
# Access token истекает через 15 минут (900000 мс)
app.jwt.access-expiration-ms=900000
# Refresh token истекает через 7 дней
app.jwt.refresh-expiration-days=7

# =============================================================
# JSON
# =============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
