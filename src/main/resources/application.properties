# ===================================
# Настройки приложения CineBase
# ===================================
spring.application.name=film-catalog
server.port=8080

# ===================================
# База данных SQLite
# ===================================
spring.datasource.url=jdbc:sqlite:film_catalog.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ===================================
# JPA / Hibernate
# ===================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================================
# JWT Configuration
# ===================================
# Сгенерируйте свой секрет: openssl rand -base64 48
app.jwt.secret=Q2luZUJhc2VTZWNyZXRLZXkyMDI2QnN1aXJDb3Vyc2VQcm9qZWN0Snd0U2lnbktleQ==
# Access token: 15 минут
app.jwt.access-expiration-ms=900000
# Refresh token: 7 дней
app.jwt.refresh-expiration-days=7

