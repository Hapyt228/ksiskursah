# ===================================
# Настройки приложения CineBase
# ===================================
spring.application.name=film-catalog
server.port=8080

# ===================================
# База данных SQLite
# ===================================
spring.datasource.url=jdbc:sqlite:film_catalog.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ===================================
# JPA / Hibernate
# ===================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================================
# JWT Configuration
# ===================================
# Сгенерируйте свой секрет: openssl rand -base64 48
app.jwt.secret=YOUR_JWT_SECRET_BASE64_HERE
# Access token: 15 минут
app.jwt.access-expiration-ms=900000
# Refresh token: 7 дней
app.jwt.refresh-expiration-days=7

# ===================================
# TMDb API
# ===================================
# Получить ключ: https://www.themoviedb.org/settings/api
# Выбрать: Developer → API Read Access Token (Bearer token, начинается с eyJ...)
tmdb.api.token=YOUR_TMDB_READ_ACCESS_TOKEN_HERE
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.image-base-url=https://image.tmdb.org/t/p/w500
tmdb.api.language=ru-RU

# ===================================
# JSON
# ===================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
